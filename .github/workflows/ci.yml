name: CI

# One check per PR, on the merge result. Branch pushes without a PR are not
# checked separately (that only duplicated this run), and main is checked
# by the deploy workflow before it publishes.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, format, tests
        run: npm run check
      - name: Build (also validates all content against its schemas)
        run: npm run build
